<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачи — Вахитов Ринар</title>
    <style>
        :root {
            --ink: #1f2a44;
            --text: #2b2b2b;
            --muted: #6b7280;
            --line: #dcdfe4;
            --mark: #ffd84d;
            --bg: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #c9d4f2;
                --text: #e6e6e6;
                --muted: #9aa1ad;
                --line: #343a46;
                --bg: #171a21;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1.05rem;
            line-height: 1.55;
            border-top: 6px solid var(--ink);
        }
        .page { max-width: 38rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
        header { margin-bottom: 2.25rem; }
        header h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.4rem;
            line-height: 1.1;
            color: var(--ink);
        }
        header p { margin: .4rem 0 0; color: var(--muted); font-size: .95rem; }
 
        form { display: flex; gap: .75rem; margin-bottom: 2.5rem; }
        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: .6rem .1rem;
            font: inherit;
            color: var(--text);
            background: transparent;
            border: 0;
            border-bottom: 2px solid var(--ink);
            border-radius: 0;
        }
        input[type="text"]::placeholder { color: var(--muted); }
        input[type="text"]:focus { outline: none; border-bottom-color: var(--mark); box-shadow: 0 2px 0 var(--mark); }
        button {
            padding: .6rem 1.2rem;
            font: inherit;
            font-weight: 600;
            color: #1f2a44;
            background: var(--mark);
            border: 2px solid #1f2a44;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #ffe27a; }
        button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
 
        h2 { margin: 0 0 .75rem; font-size: 1.15rem; color: var(--ink); }
        .count { color: var(--muted); font-weight: 400; margin-left: .4rem; }
        ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
        ol li { display: flex; gap: .9rem; padding: .8rem 0; border-bottom: 1px solid var(--line); }
        ol .n { width: 1.6rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
        a { color: var(--text); text-decoration-color: var(--line); text-underline-offset: 3px; }
        a:hover { color: var(--ink); text-decoration-color: var(--ink); }
        .empty { color: var(--muted); }
 
        .single .label { color: var(--muted); margin: 0 0 .25rem; font-size: .95rem; }
        .single .text { font-family: Georgia, "Times New Roman", serif; font-size: 1.7rem; line-height: 1.3; margin: 0 0 2rem; color: var(--ink); }
        footer { margin-top: 3.5rem; color: var(--muted); font-size: .85rem; }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Задачи</h1>
            <p>Практическое занятие №6, Вахитов Ринар</p>
        </header>
 
        {% block todo_container %}{% endblock %}
 
        <footer>Данные хранятся в памяти и пропадают при перезапуске сервера.</footer>
    </div>
</body>
</html>
