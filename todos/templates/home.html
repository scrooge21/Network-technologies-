<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application — Вахитов Ринар</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        .app-header { color: #fff; text-align: center; padding: 2.5rem 1rem 1.5rem; }
        .app-header h1 { font-weight: 700; letter-spacing: .5px; }
        .app-header p { opacity: .85; margin: 0; }
        .app-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
        }
        .btn-gradient:hover { color: #fff; opacity: .9; }
        .todo-num {
            width: 2rem; height: 2rem; border-radius: 50%;
            background: #eef0ff; color: #667eea; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
            margin-right: .75rem; flex-shrink: 0;
        }
        .list-group-item { border: none; border-bottom: 1px solid #f0f0f5; padding: .9rem 1.25rem; }
        .list-group-item a { color: #333; text-decoration: none; font-weight: 500; }
        .list-group-item:hover { background: #f8f9ff; }
        footer { color: rgba(255, 255, 255, .75); text-align: center; padding: 2rem 1rem; font-size: .9rem; }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>📝 Todo Application</h1>
        <p>Разработчик: Вахитов Ринар</p>
    </header>
 
    <div class="container pb-4" style="max-width: 720px;">
        {% block todo_container %}{% endblock %}
    </div>
 
    <footer>FastAPI + Jinja2 · Практическое занятие №6</footer>
</body>
</html>
